name: ci
on:
  push:
    branches: [main, master] # master is the only branch that exists; no remote yet
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite is still flagged experimental; 22.5 is the floor the
          # DatabaseSync API needs, 24 is what the suite is developed against.
          node-version: 24
      - run: npm ci
      # The console build comes first because the suite needs it. `/` serves the console
      # (ADR-0008) out of `ui/dist`, and answers 404 with "console not built" when it is
      # absent — so `tests/api.test.ts > serves the UI from the same origin` fails on a
      # clean checkout. It passed on the machine this was written on only because `ui/dist`
      # was already there. Root `npm ci` deliberately does not install these dev deps.
      - run: npm --prefix ui ci
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui run build

      # Types before tests: a broken signature is a cheaper failure to read
      # than a test stack trace pointing at the same line.
      - run: npm run lint
      - run: npm test

      # The published package is a build artifact, not the repo. A broken
      # `build`, or tests leaking into the tarball, is a release bug that only
      # shows up after someone installs it.
      - run: npm run build
      - run: npm pack --dry-run

      # Install it the way a user does and use it. Every failure below was real:
      # a `bin` pointing at a path the build never produced, a UI that 404ed only
      # from an installed copy, a `version` command that crashed on a missing
      # `dist/package.json`, and a `GET /memories/search` shadowed by the
      # `/memories/:id` route so every daemon-backed search answered 404.
      - name: install the tarball and exercise it
        run: |
          set -euo pipefail
          # Ask npm what it wrote instead of naming the file: the tarball is
          # `franklinww-open-memory-<version>.tgz`, so a glob on the bare
          # `open-memory-*` matched nothing since the package was scoped and
          # `npm i` then tried to open the literal pattern. Same trap this step
          # already documents one line lower down.
          TARBALL="/tmp/$(npm pack --json --pack-destination /tmp | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename")"
          npm i -g --prefix /tmp/inst "$TARBALL"
          export AI_MEMORY_HOME=/tmp/inst-store
          export PATH=/tmp/inst/bin:$PATH   # npm puts global bins in <prefix>/bin on POSIX

          # 1. the binary exists and answers
          open-memory db info
          open-memory version | grep -qv unknown

          # A global install lands in <prefix>/lib/node_modules on POSIX and
          # <prefix>/node_modules on Windows, so ask npm where it went rather than
          # assuming — the first version of this step assumed, and stopped here.
          # The install dir is the package name, which is scoped: derive it from
          # the manifest rather than hard-coding either spelling.
          PKG="$(npm root -g --prefix /tmp/inst)/$(node -p "require('./package.json').name")"

          # 2. the static UI shipped. It is served, not imported, so tsc does not
          #    carry it into dist — only the copy-ui build step does.
          test -f "$PKG/dist/src/ui/graph.html"

          # 2b. and the console did, which root `npm ci` alone cannot arrange.
          test -f "$PKG/dist/src/ui-next/index.html"

          # 3. save, then search it back through the in-process path
          open-memory save "ci smoke" --type semantic
          open-memory --no-daemon search "ci smoke" --threshold 0 --explain

          # 4. and through the daemon path, which is the one that was broken:
          #    the CLI queries with GET, so this fails if either the route ordering
          #    regresses or the version check stops recognising its own daemon.
          PORT=7399 node "$PKG/dist/src/api/server.js" &
          sleep 3
          # No `-q`: grep exiting at the first match can SIGPIPE the writer, and with
          # pipefail that fails the pipeline for a reason that has nothing to do with health.
          curl -sf localhost:7399/health | grep '"version"' >/dev/null
          AI_MEMORY_SERVER=http://127.0.0.1:7399 open-memory search "ci smoke" --threshold 0 | grep "ci smoke" >/dev/null

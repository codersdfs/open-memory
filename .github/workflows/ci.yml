name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite is still flagged experimental; 22.5 is the floor the
          # DatabaseSync API needs, 24 is what the suite is developed against.
          node-version: 24
      - run: npm ci
      # Types before tests: a broken signature is a cheaper failure to read
      # than a test stack trace pointing at the same line.
      - run: npm run lint
      - run: npm test
      # The published package is a build artifact, not the repo. If `build` is
      # broken, or tests leak into the tarball, that is a release bug that only
      # shows up after someone installs it.
      - run: npm run build
      - run: npm pack --dry-run
      # The one check that would have caught a bin pointing at the wrong path:
      # install it the way a user does and run it.
      - name: install the tarball and run the CLI
        run: |
          npm pack --pack-destination /tmp
          npm i -g --prefix /tmp/inst /tmp/ai-memory-*.tgz
          AI_MEMORY_HOME=/tmp/inst-store /tmp/inst/ai-memory db info
          AI_MEMORY_HOME=/tmp/inst-store /tmp/inst/ai-memory save "ci smoke" --type semantic
          AI_MEMORY_HOME=/tmp/inst-store /tmp/inst/ai-memory search "ci smoke" --threshold 0 --explain
          # The UI is served, not imported, so tsc does not carry it into dist.
          # Without the copy-ui step this 404s only after someone installs it.
          test -f /tmp/inst/node_modules/ai-memory/dist/src/ui/graph.html

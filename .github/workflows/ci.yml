name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite is still flagged experimental; 22.5 is the floor the
          # DatabaseSync API needs, 24 is what the suite is developed against.
          node-version: 24
      - run: npm ci
      # Types before tests: a broken signature is a cheaper failure to read
      # than a test stack trace pointing at the same line.
      - run: npm run lint
      - run: npm test
      # The published package is a build artifact, not the repo. A broken
      # `build`, or tests leaking into the tarball, is a release bug that only
      # shows up after someone installs it.
      # The console IS the UI now (ADR-0008), and root `npm ci` deliberately does
      # not install its dev deps — so the tarball carries a console only because
      # this step builds one. `npm run build` still succeeds without it.
      - run: npm --prefix ui ci
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui run build

      - run: npm run build
      - run: npm pack --dry-run

      # Install it the way a user does and use it. Every failure below was real:
      # a `bin` pointing at a path the build never produced, a UI that 404ed only
      # from an installed copy, a `version` command that crashed on a missing
      # `dist/package.json`, and a `GET /memories/search` shadowed by the
      # `/memories/:id` route so every daemon-backed search answered 404.
      - name: install the tarball and exercise it
        run: |
          set -euo pipefail
          npm pack --pack-destination /tmp
          npm i -g --prefix /tmp/inst /tmp/open-memory-*.tgz
          export AI_MEMORY_HOME=/tmp/inst-store
          export PATH=/tmp/inst:$PATH

          # 1. the binary exists and answers
          open-memory db info
          open-memory version | grep -qv unknown

          # 2. the static UI shipped. It is served, not imported, so tsc does not
          #    carry it into dist — only the copy-ui build step does.
          test -f /tmp/inst/node_modules/open-memory/dist/src/ui/graph.html

          # 2b. and the console did, which root `npm ci` alone cannot arrange.
          test -f /tmp/inst/node_modules/open-memory/dist/src/ui-next/index.html

          # 3. save, then search it back through the in-process path
          open-memory save "ci smoke" --type semantic
          open-memory --no-daemon search "ci smoke" --threshold 0 --explain

          # 4. and through the daemon path, which is the one that was broken:
          #    the CLI queries with GET, so this fails if either the route ordering
          #    regresses or the version check stops recognising its own daemon.
          PORT=7399 node /tmp/inst/node_modules/open-memory/dist/src/api/server.js &
          sleep 3
          curl -sf localhost:7399/health | grep -q '"version"'
          AI_MEMORY_SERVER=http://127.0.0.1:7399 open-memory search "ci smoke" --threshold 0 | grep -q "ci smoke"
